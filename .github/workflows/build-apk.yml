name: Build Zapple APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Zapple project
        shell: bash
        run: |
          rm -rf project
          mkdir -p project
          unzip -o zapple-project.zip -d project

          if [ -f "project/package.json" ]; then
            cp -a project/. .
          else
            PROJECT_DIR=$(find project -maxdepth 2 -name package.json -printf '%h\n' | head -n 1)
            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: package.json not found"
              exit 1
            fi
            cp -a "$PROJECT_DIR"/. .
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Check APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zapple-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
